# name: apf TODO: does not work, caused error
services:
  db:
    # specify container name to make it easier to run commands
    container_name: apf_db
    restart: always
    image: apf-db-dev
    # ensure enough shared memory - docker only allows 64mb
    # https://stackoverflow.com/a/56754077/712005
    shm_size: 1g
    build:
      context: ./db
    env_file:
      - ./.env
    networks:
      - network
    expose:
      - '5432'
    ports:
      # make the Postgres database accessible from outside the Docker container on port 5432
      - '127.0.0.1:5432:5432'
    volumes:
      # since PG 18 the image manages version-specific data dirs itself,
      # so mount the volume at /var/lib/postgresql, not .../data
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
    platform: linux/amd64
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      # give the first-run restore of apflora.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  # PostgREST — same db, same JWT secret as the former PostGraphile
  # stack (the graphql → postgrest migration is complete).
  # Version and settings match ae3's migration (v12.2.3, see its
  # backend/db/migrations/2026-10-27-postgrest-auth.sql diary).
  postgrest:
    container_name: apf_postgrest
    restart: always
    image: postgrest/postgrest:v12.2.3
    networks:
      - network
    expose:
      - '3000'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      # connects as the authenticator role (noinherit), switches to the
      # JWT role claim per request — same model as PostGraphile
      PGRST_DB_URI: ${DATABASE_URL}
      PGRST_DB_SCHEMAS: apflora
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # v12 otherwise tries to read its config from the db
      PGRST_DB_CONFIG: 'false'
      PGRST_SERVER_CORS_ENABLED: 'true'
      # keep in sync with backend/docker-compose.yml (#836)
      PGRST_DB_POOL: '20'
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: '30'
volumes:
  db_data:
  sik_data:
networks:
  network:
