<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="/safari-pinned-tab.svg"
      color="#256328"
    />
    <meta
      name="msapplication-TileColor"
      content="#256328"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Bedrohte Pflanzenarten fördern"
    />
    <meta
      name="keywords"
      content="Naturschutz, Artenschutz, Flora, Pflanzen"
    />
    <meta
      name="theme-color"
      content="#256328"
    />
    <meta
      name="background-color"
      content="#fffde7"
    />
    <title>apflora</title>
    <script>
      // Home's hero image is the LCP element of "/" (every hard load of
      // "/" renders Home – also for logged-in users, because the redirect
      // to the last active node needs the navigate function, which is
      // only set inside /Daten routes). Deep urls render other pages,
      // so only preload it on "/". Blocking inline script: runs before
      // the entry bundle starts downloading, so the image fetch
      // parallels the JS boot chain.
      if (window.location.pathname === '/') {
        const link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.type = 'image/avif'
        link.setAttribute(
          'imagesrcset',
          '/home_700.avif 700w, /home_1000.avif 1000w, /home_1400.avif 1400w, /home_2000.avif 2000w, /home_2500.avif 2500w',
        )
        link.setAttribute('imagesizes', '100vw')
        link.setAttribute('fetchpriority', 'high')
        document.head.appendChild(link)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
