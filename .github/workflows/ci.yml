name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (baseline — fails on new errors only)
        run: npm run typecheck:ci
      - name: Unit tests
        run: npm run test:unit
      - name: Generated selects are fresh
        run: |
          npm run selects:generate
          git diff --exit-code src/modules/selects.ts || (echo "src/modules/selects.ts is stale — run: npm run selects:generate" && exit 1)
