# name: apf
services:
  db:
    # specify container name to make it easier to run commands
    container_name: apf_db
    restart: always
    image: apf-db
    # ensure enough shared memory - docker only allows 64mb
    # https://stackoverflow.com/a/56754077/712005
    shm_size: 1g
    build:
      context: ./db
    env_file:
      - ./.env
    networks:
      - network
    expose:
      - "5432"
    ports:
      # make the Postgres database accessible from outside the Docker container on port 5432
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
      # keep the rclone config (nextcloud backup target) across container recreations
      - /root/backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      # give the first-run restore of apflora.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  graphql:
    container_name: apf_graphql
    restart: always
    build:
      context: ./graphql
    networks:
      - network
    expose:
      - "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./.env
    command:
      [
        "--connection",
        "${DATABASE_URL}",
        "--schema",
        "apflora",
        "--append-plugins",
        "postgraphile-plugin-connection-filter,@graphile-contrib/pg-order-by-related,@graphile/postgis,postgraphile-plugin-connection-filter-postgis",
        "--jwt-token-identifier",
        "auth.jwt_token",
        "--default-role",
        "anon",
        "--jwt-secret",
        "${JWT_SECRET}",
        "--body-size-limit",
        "2MB",
        "--cors",
        "--disable-query-log",
        "--disable-graphiql",
        "--enable-query-batching",
        "--retry-on-init-fail",
      ]
  # PostgREST migration dual-stack (tasks.md phase 1) — same db, same JWT
  # secret as PostGraphile, so modules can migrate one by one.
  # Version and settings match ae3 (v12.2.3; see its
  # backend/db/migrations/2026-10-27-postgrest-auth.sql diary).
  postgrest:
    container_name: apf_postgrest
    restart: always
    image: postgrest/postgrest:v12.2.3
    networks:
      - network
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      # connects as the authenticator role (noinherit), switches to the
      # JWT role claim per request — same model as PostGraphile
      PGRST_DB_URI: ${DATABASE_URL}
      PGRST_DB_SCHEMAS: apflora
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # v12 otherwise tries to read its config from the db
      PGRST_DB_CONFIG: "false"
      PGRST_SERVER_CORS_ENABLED: "true"
  caddy:
    build:
      context: ./caddy
    container_name: apf_caddy
    networks:
      - network
    depends_on:
      - graphql
      - postgrest
    restart: always
    # original image downgrades user but that seems not to work
    # see: https://caddy.community/t/basic-docker-compose-setup-failing/6892/7?u=alexander_gabriel
    user: root
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
volumes:
  db_data:
  sik_data:
  caddy_data:
  caddy_config:
networks:
  network:
